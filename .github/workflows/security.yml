name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    name: Dependency and static security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build --target test --tag job-scraper:security .

      - name: Audit Python dependencies
        run: docker run --rm job-scraper:security pip-audit --local

      - name: Run Bandit
        run: docker run --rm job-scraper:security bandit --recursive app.py config.py data scraper

  image:
    name: Container vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --provenance=false --sbom=false --target runtime --tag job-scraper:security-runtime .

      - name: Scan runtime image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: job-scraper:security-runtime
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Upload SBOM
        uses: anchore/sbom-action@v0.17.0
        with:
          image: job-scraper:security-runtime
          artifact-name: job-scraper-sbom.spdx.json
          output-file: job-scraper-sbom.spdx.json
