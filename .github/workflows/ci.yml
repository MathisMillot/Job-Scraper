name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        run: |
          docker build \
            --target test \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            --tag job-scraper:test-${{ matrix.python-version }} \
            .

      - name: Run backend tests with coverage
        run: |
          mkdir -p "coverage-${{ matrix.python-version }}"
          docker run --rm \
            --volume "$PWD/coverage-${{ matrix.python-version }}:/app/coverage" \
            --env APP_ENV=testing \
            --env SECRET_KEY=ci-test-secret \
            --env CSRF_ENABLED=false \
            --env TRUSTSTORE_ENABLED=false \
            job-scraper:test-${{ matrix.python-version }} \
            pytest -m "not e2e" \
              --cov \
              --cov-report=term-missing \
              --cov-report=xml:/app/coverage/coverage.xml

      - name: Run Ruff
        run: docker run --rm job-scraper:test-${{ matrix.python-version }} ruff check .

      - name: Run mypy
        run: |
          docker run --rm job-scraper:test-${{ matrix.python-version }} \
            mypy app.py config.py data scraper

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}/coverage.xml

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build browser test image
        run: docker build --target e2e --tag job-scraper:e2e .

      - name: Run Playwright tests
        run: |
          docker run --rm --ipc=host \
            --env APP_ENV=testing \
            --env SECRET_KEY=ci-browser-secret \
            --env CSRF_ENABLED=false \
            --env TRUSTSTORE_ENABLED=false \
            job-scraper:e2e \
            pytest -m e2e --browser chromium

  container:
    name: Runtime container smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build --target runtime --tag job-scraper:runtime .

      - name: Start runtime container
        run: |
          docker run --detach --name job-scraper-smoke --publish 8000:8000 \
            --env APP_ENV=development \
            --env SECRET_KEY=ci-smoke-secret \
            --env CSRF_ENABLED=false \
            --env TRUSTSTORE_ENABLED=false \
            --env WTTJ_APP_ID=ci-app \
            --env WTTJ_API_KEY=ci-key \
            --env DB_PATH=/home/jobs.db \
            job-scraper:runtime

      - name: Check health and non-root execution
        run: |
          curl --fail --retry 20 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health
          test "$(docker exec job-scraper-smoke id -u)" != "0"

      - name: Stop runtime container
        if: always()
        run: docker rm --force job-scraper-smoke
